version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexchat-postgres
    restart: always
    environment:
      POSTGRES_USER: nexchat
      POSTGRES_PASSWORD: nexchat_secure_password_2026
      POSTGRES_DB: nexchat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexchat -d nexchat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexchat-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: nexchat-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://nexchat:nexchat_secure_password_2026@postgres:5432/nexchat_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "nexchat_super_secret_access_key_2026"
      JWT_REFRESH_SECRET: "nexchat_super_secret_refresh_key_2026"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexchat-web
    restart: always
    depends_on:
      - server
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:4000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
